name: iOS build
on:
  workflow_dispatch:
    inputs:
      device_only:
        description: '仅构建设备 IPA'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}${{ inputs.device_only && '-device' || '' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
      - name: Build iPhone and iPad IPA
        run: python3 scripts/build_ios.py
      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: NEC-Mobile-iOS-device
          path: release/NEC-Mobile-iOS-unsigned.ipa
          retention-days: 14
      - name: Build simulator app
        if: ${{ !inputs.device_only }}
        run: python3 scripts/build_ios.py --simulator
      - uses: actions/upload-artifact@v4
        if: success() && !inputs.device_only
        with:
          name: NEC-Mobile-iOS
          path: |
            release/NEC-Mobile-iOS-unsigned.ipa
            release/NEC-Mobile-iOS-simulator.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-build-diagnostics
          path: |
            work/ios-device/CMakeFiles/CMakeConfigureLog.yaml
            work/ios-simulator/CMakeFiles/CMakeConfigureLog.yaml
