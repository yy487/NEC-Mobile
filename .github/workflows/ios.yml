name: iOS build
on:
  workflow_dispatch:
    inputs:
      device_only:
        description: '仅构建设备 IPA'
        type: boolean
        default: false
  push:
    branches: [main, ios-port]
    paths:
      - '.github/workflows/ios.yml'
      - 'ios/**'
      - 'native/**'
      - 'scripts/**'
      - 'third_party/**'
      - 'app/src/main/assets/**'
      - 'CHANGELOG.md'
      - 'version.properties'
      - 'app/src/main/java/org/necmobile/MachineOptions.java'
      - 'app/src/main/java/org/necmobile/InputPresets.java'
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}${{ inputs.device_only && '-device' || '' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
      - name: Build iPhone and iPad IPA
        run: python3 scripts/build_ios.py
      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: NEC-Mobile-iOS-device
          path: release/NEC-Mobile-iOS-unsigned.ipa
          retention-days: 14
      - name: Build simulator app
        if: ${{ !inputs.device_only }}
        run: python3 scripts/build_ios.py --simulator
      - name: Run simulator smoke check
        if: ${{ !inputs.device_only }}
        run: python3 scripts/smoke_ios.py
      - uses: actions/upload-artifact@v4
        if: success() && !inputs.device_only
        with:
          name: NEC-Mobile-iOS
          path: |
            release/NEC-Mobile-iOS-unsigned.ipa
            release/NEC-Mobile-iOS-simulator.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.device_only
        with:
          name: iOS-simulator-check
          path: |
            work/ios-smoke.log
            work/ios-runtime.log
            work/ios-smoke/*.png
            work/ios-import-ui/**/*
            work/ios-import-ui.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-build-diagnostics
          path: |
            work/ios-device/CMakeFiles/CMakeConfigureLog.yaml
            work/ios-simulator/CMakeFiles/CMakeConfigureLog.yaml
            work/ios-smoke.log
